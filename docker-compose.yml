services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/southpay-gateway-for-woocommerce

  setup:
    image: wordpress:cli
    restart: "no"
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/southpay-gateway-for-woocommerce
    entrypoint: >
      sh -c "
        echo 'Waiting for WordPress to initialise...' &&
        until [ -f /var/www/html/wp-config.php ]; do sleep 2; done &&
        echo 'Installing WordPress...' &&
        wp core install --path=/var/www/html --url=http://localhost:8080 --title='SouthPay Dev' --admin_user=admin --admin_password=admin --admin_email=dev@localhost.com --allow-root --skip-email &&
        echo 'Installing WooCommerce...' &&
        wp plugin install woocommerce --activate --allow-root &&
        echo 'Activating SouthPay plugin...' &&
        wp plugin activate southpay-gateway-for-woocommerce --allow-root &&
        wp wc tool run install_pages --user=admin --allow-root &&
        echo '' &&
        echo '✅ Ready at http://localhost:8080' &&
        echo '   Admin: http://localhost:8080/wp-admin  (admin / admin)' &&
        echo '   Gateway: WooCommerce → Settings → Payments → SouthPay'
      "

volumes:
  db_data:
  wp_data:
