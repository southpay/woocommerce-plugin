name: Deploy to WordPress.org

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy plugin to wp.org SVN
    runs-on: ubuntu-latest
    environment: wordpress-org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plugin header version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER_VERSION=$(grep -E '^\s*\*\s*Version:' southpay-gateway-for-woocommerce.php | head -1 | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          STABLE_TAG=$(grep -E '^Stable tag:' readme.txt | head -1 | sed -E 's/Stable tag:\s*//' | tr -d '[:space:]')
          echo "Tag:           $TAG"
          echo "Plugin header: $HEADER_VERSION"
          echo "Stable tag:    $STABLE_TAG"
          if [ "$TAG" != "$HEADER_VERSION" ] || [ "$TAG" != "$STABLE_TAG" ]; then
            echo "::error::Version mismatch — tag, plugin header, and readme Stable tag must all match."
            exit 1
          fi

      - name: WordPress.org plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: southpay-gateway-for-woocommerce
